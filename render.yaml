services:
  - type: web
    name: fichapro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS
        value: "1"
      - key: DB
        value: fichapro.db
      - key: PLATFORM_PASSWORD
        sync: false
